name: Deploy demo page

# Publishes test/index.html as the site root, so the WebAuthn demo is reachable
# over HTTPS. That matters: navigator.credentials.create() requires a secure
# context, so the page cannot be opened as a file:// URL and otherwise needs a
# local server.
#
# `enablement: true` below lets this workflow turn Pages on by itself the first
# time it runs, so no manual repository setting is required.

on:
  push:
    branches: [main]
    paths:
      - 'test/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather than
# cancelling it -- a cancelled deploy can leave the site on an older build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the demo page is published. The firmware, tools and test suites
      # stay in the repository but are not served.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp test/index.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
